<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnix - Tizimga kirish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-main); overflow: hidden; }
        .login-wrapper { background: var(--surface-glass); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border-solid); padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--glass-shadow); width: 100%; max-width: 380px; text-align: center; z-index: 10; }
        .login-wrapper h2 { font-family: var(--font-heading); color: var(--text-primary); margin-bottom: 8px; font-size: 24px; }
        .login-wrapper p { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--glass-border); border-radius: var(--radius-md); background: var(--surface-solid); font-size: 13px; color: var(--text-primary); outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary-indigo); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .btn-login { width: 100%; padding: 12px; background: var(--primary-gradient); color: white; border: none; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 14px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3); }
        #error-msg { color: var(--danger-red); font-size: 12px; font-weight: 600; margin-top: 14px; display: none; }
    </style>
</head>
<body>
$END$
</body>
</html>
